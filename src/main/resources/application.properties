spring.application.name=insumap

# Puerto (Render y otras plataformas inyectan PORT)
server.port=${PORT:8080}

# MongoDB: local por defecto; en despliegue se usa la variable MONGODB_URI (MongoDB Atlas)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/insumap}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/insumap}
spring.data.mongodb.auto-index-creation=true
# Nombre de la base de datos: se usa aunque la cadena de conexion no lo incluya (ej. .../?retryWrites=true)
spring.mongodb.database=${MONGODB_DATABASE:insumap}
spring.data.mongodb.database=${MONGODB_DATABASE:insumap}

# Respuestas JSON
spring.jackson.default-property-inclusion=non_null

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.tags-sorter=alpha

# Actuator (health para el despliegue)
management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------
# Parametros del motor de recomendacion (RF06 - RF09)
# ---------------------------------------------------------------
# Horas base de recuperacion biologica por zona macro (RF08)
insumap.motor.horas-base-abdomen=72
insumap.motor.horas-base-muslos=96
insumap.motor.horas-base-brazos=96
insumap.motor.horas-base-gluteos=120
# Incremento del tiempo de recuperacion por cada uso extra de la microzona en la ventana (RF08)
insumap.motor.factor-frecuencia=0.25
insumap.motor.factor-frecuencia-maximo=2.0
# Fraccion del tiempo de recuperacion que se bloquean las microzonas adyacentes (RF07)
insumap.motor.factor-adyacencia=0.5
# Semaforo: progreso < umbral-rojo => ROJO; < 1 => AMARILLO; >= 1 => VERDE (RF06)
insumap.motor.umbral-rojo=0.5
# Ventana de analisis y regla de zonas olvidadas (RF09)
insumap.motor.dias-ventana=30
insumap.motor.dias-zona-olvidada=15
insumap.motor.penalizacion-zona-saturada=0.6
insumap.motor.bonificacion-zona-olvidada=1.5
insumap.motor.alternativas=3

# ---------------------------------------------------------------
# Cuadricula por defecto de cada zona macro y lado (RF02)
# ---------------------------------------------------------------
insumap.mapa.filas-por-defecto=3
insumap.mapa.columnas-por-defecto=4
insumap.mapa.tamano-maximo=8

# ---------------------------------------------------------------
# Recordatorios (RF10)
# ---------------------------------------------------------------
insumap.recordatorios.habilitado=true
insumap.recordatorios.intervalo-ms=60000
insumap.recordatorios.zona-horaria=America/Bogota
insumap.recordatorios.minutos-aplazamiento=15
insumap.recordatorios.maximo-aplazamientos=3
